name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mysql-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: SyntheticRootOnly123
          MYSQL_DATABASE: kostsan_concurrency_test
          MYSQL_USER: kostsan_ci
          MYSQL_PASSWORD: SyntheticMysqlOnly123
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: kostsan_concurrency_test
      DB_USERNAME: kostsan_ci
      DB_PASSWORD: SyntheticMysqlOnly123
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      WHATSAPP_ENABLED: 'false'
      WHATSAPP_TOKEN: ''
      PAO_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, pdo_mysql, fileinfo, curl, zip
          coverage: none
      - name: Install and prepare isolated application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
      - name: Real concurrent transactions and rollback on MySQL
        run: php tests/Concurrency/mysql.php

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, sqlite3, pdo_sqlite, fileinfo, curl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate and install PHP dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer check-platform-reqs
          composer audit --locked
      - name: Set up isolated application database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
      - name: Backend regression and HTTP smoke tests
        env:
          PAO_DISABLE: '1'
        run: vendor/bin/phpunit --fail-on-warning --fail-on-risky
      - name: Frontend build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=low
          npm test
          npm run build
          php artisan kost:check-ui --no-interaction
      - name: Compile routes and views
        run: |
          php artisan route:cache
          php artisan view:cache

  browser-smoke:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/storage/framework/testing/browser.sqlite
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: file
      MAIL_MAILER: array
      WHATSAPP_ENABLED: 'false'
      WHATSAPP_TOKEN: ''
      BROWSER_TEST_PASSWORD: SyntheticBrowserOnly123
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, sqlite3, pdo_sqlite, fileinfo, curl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies and browser
        run: |
          composer install --no-interaction --prefer-dist
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium --only-shell
      - name: Prepare isolated synthetic browser database
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p storage/framework/testing
          touch "$DB_DATABASE"
          php artisan migrate --force
          php tests/Browser/seed.php
          npm run build
          php artisan kost:check-ui --no-interaction
      - name: Test phone, tablet and desktop
        run: npm run test:browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
